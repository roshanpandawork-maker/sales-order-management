<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' https://noldgjtoqhwefqdzdpzs.supabase.co; base-uri 'none'; object-src 'none'; frame-ancestors 'none'">
<meta name="robots" content="noindex,nofollow">
<title>SalesDesk | Live Party Balance</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7fb;color:#172033}
.wrap{max-width:1050px;margin:0 auto;padding:24px 16px}.card{background:#fff;border:1px solid #e3e8f0;border-radius:18px;box-shadow:0 8px 30px #16233d0d;margin-bottom:16px;padding:22px}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.brand{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#4f67d8}.muted{color:#687386}.status{padding:7px 11px;border-radius:999px;background:#eaf8ef;color:#19723b;font-size:12px;font-weight:700;white-space:nowrap}
h1{margin:6px 0 4px;font-size:28px}h2{margin:0 0 4px;font-size:18px}.updated{font-size:12px;color:#7a8494}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:16px;border:1px solid #e7ebf2;border-radius:14px;background:#fbfcfe}.metric span{display:block;color:#6c7688;font-size:12px}.metric strong{display:block;margin-top:5px;font-size:24px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:13px 10px;border-bottom:1px solid #edf0f5;text-align:left}th{font-size:12px;color:#6b7485;text-transform:uppercase;letter-spacing:.04em}td{font-size:14px}.balance{font-weight:800}.rate{white-space:nowrap}.empty{text-align:center;padding:35px;color:#6b7485}.error{background:#fff1f1;color:#a51d1d;border:1px solid #ffd4d4;border-radius:12px;padding:14px;display:none}
@media(max-width:650px){.wrap{padding:14px 10px}.head{display:block}.status{display:inline-block;margin-top:12px}.metrics{grid-template-columns:1fr}h1{font-size:23px}.card{padding:16px;border-radius:14px}}
</style></head><body>
<div class="wrap">
 <div class="card">
  <div class="head"><div><div class="brand">SalesDesk</div><h1 id="partyName">Loading party…</h1><div class="muted">Live Sales Order Balance</div></div><div class="status" id="status">Connecting…</div></div>
  <div class="updated" id="updated" style="margin-top:12px">Waiting for live data</div>
 </div>
 <div class="metrics">
  <div class="metric"><span>Open products</span><strong id="productCount">0</strong></div>
  <div class="metric"><span>Total ordered</span><strong id="orderedTotal">0</strong></div>
  <div class="metric"><span>Current balance</span><strong id="balanceTotal">0</strong></div>
 </div>
 <div class="card"><h2>Available quantity</h2><div class="muted" style="font-size:13px;margin:4px 0 16px">This page updates automatically when dispatch quantities change.</div><div id="error" class="error"></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Unit</th><th>Rate</th><th>Ordered</th><th>Dispatched</th><th>Available</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody></table></div></div>
</div>
<script>
const SUPABASE_URL='https://noldgjtoqhwefqdzdpzs.supabase.co';
const SUPABASE_KEY='sb_publishable_ZnaKalL6dJvrQjWE4k5zAw_h2A62Obq';
const qs=new URLSearchParams(location.search);\nconst token=qs.get('token')||new URLSearchParams((location.hash||'').replace(/^#/,'')).get('token');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:3});
async function load(){
 const status=document.getElementById('status'),err=document.getElementById('error');
 if(!token){status.textContent='Invalid link';err.style.display='block';err.textContent='This party link is missing its access token.';return}
 try{
  const res=await fetch(SUPABASE_URL+'/rest/v1/rpc/get_party_live_balance',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:token})});
  const data=await res.json(); if(!res.ok)throw new Error(data.message||'Unable to load balance');
  err.style.display='none';status.textContent='● Live';
  const party=data[0]?.party_name||'Party';
  document.getElementById('partyName').textContent=party;
  document.getElementById('productCount').textContent=data.length;
  document.getElementById('orderedTotal').textContent=data.reduce((a,x)=>a+Number(x.ordered||0),0).toLocaleString('en-IN',{maximumFractionDigits:3});
  document.getElementById('balanceTotal').textContent=data.reduce((a,x)=>a+Number(x.balance||0),0).toLocaleString('en-IN',{maximumFractionDigits:3});
  document.getElementById('updated').textContent='Last updated: '+new Date().toLocaleString('en-IN');
  document.getElementById('rows').innerHTML=data.length?data.map(x=>'<tr><td><b>'+esc(x.product_name||x.product_code)+'</b></td><td>'+esc(x.unit)+'</td><td class="rate">₹'+fmt(x.rate)+'</td><td>'+fmt(x.ordered)+'</td><td>'+fmt(x.dispatched)+'</td><td class="balance">'+fmt(x.balance)+'</td></tr>').join(''):'<tr><td colspan="6" class="empty">No open quantity is currently available.</td></tr>';
 }catch(e){status.textContent='Connection error';err.style.display='block';err.textContent=e.message||'Unable to load live balance.'}
}
load();setInterval(load,15000);
</script></body></html>
