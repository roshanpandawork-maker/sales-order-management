name: Build SalesDesk Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web bundle
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp -r css js vendor www/

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android app icon
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#0f172a' --iconBackgroundColorDark '#0f172a'

      - name: Sync web app
        run: npx cap sync android

      - name: Configure microphone permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if "android.permission.RECORD_AUDIO" not in s:
              s=s.replace("<manifest xmlns:android=", "<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n<manifest xmlns:android=")
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SalesDesk-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
