plugins {
    id 'com.android.application'
}

android {
    namespace 'com.salesdesk.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.salesdesk.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
}
